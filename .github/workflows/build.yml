name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/InputMethodSwitcher-*.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "构建 ${{ github.run_number }}"
          tag_name: "build-${{ github.run_number }}"
          files: app/build/outputs/apk/debug/InputMethodSwitcher-*.apk
          body: |
            直接下载 InputMethodSwitcher-*.apk 安装到手机。
            （Debug 版，如提示"未知来源"请在设置中允许安装）
